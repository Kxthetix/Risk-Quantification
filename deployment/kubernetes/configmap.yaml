apiVersion: v1
kind: ConfigMap
metadata:
  name: cyber-risk-config
  namespace: cyber-risk-platform
data:
  APP_NAME: "Cybersecurity Risk & Financial Impact Platform"
  APP_ENV: "production"
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"
  RATE_LIMIT_ENABLED: "true"
  SECURITY_HEADERS_ENABLED: "true"
  PROMETHEUS_METRICS_ENABLED: "true"
  LOG_LEVEL: "INFO"
  STRUCTURED_LOGGING: "true"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
