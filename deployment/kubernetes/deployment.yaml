apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-risk-api
  namespace: cyber-risk-platform
  labels:
    app.kubernetes.io/name: cyber-risk-api
    app.kubernetes.io/part-of: cyber-risk-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-risk-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-risk-api
    spec:
      serviceAccountName: cyber-risk-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: cyber-risk-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cyber-risk-config
            - secretRef:
                name: cyber-risk-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: artifacts-volume
              mountPath: /app/artifacts
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: artifacts-volume
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-risk-worker
  namespace: cyber-risk-platform
  labels:
    app.kubernetes.io/name: cyber-risk-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-risk-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-risk-worker
    spec:
      serviceAccountName: cyber-risk-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: cyber-risk-worker:1.0.0
          envFrom:
            - configMapRef:
                name: cyber-risk-config
            - secretRef:
                name: cyber-risk-secrets
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 1024Mi
